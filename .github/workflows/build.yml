name: Build & Test

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: macos-26
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v6

      - name: 🔧 Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.4.app"

      - name: 🧪 Build and run tests
        run: |
          xcodebuild -project Colonnade.xcodeproj -scheme Colonnade -configuration Debug \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- \
            test
